<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario de Clases - Agenda 6to A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="horario.css">
</head>
<body class="text-slate-100 min-h-screen pb-24 selection:bg-indigo-500 selection:text-white">

  <!-- Encabezado con efecto Glassmorphism -->
  <header class="sticky top-0 z-50 glass-card px-4 py-3.5 border-b border-white/5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="index.html" class="p-2.5 rounded-2xl bg-slate-800/80 text-slate-300 hover:text-white hover:bg-slate-700/80 transition-all border border-white/5 active:scale-95">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 class="text-base font-extrabold text-white tracking-tight leading-tight">Horario de Clases</h1>
        <p class="text-[11px] font-medium text-indigo-400">Turno Mañana • 6to A</p>
      </div>
    </div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-md mx-auto p-4 space-y-5 fade-in">

    <!-- Selector de vista -->
    <div class="flex glass-pill p-1.5 rounded-2xl gap-1 text-xs font-semibold">
      <button id="btn-hoy" class="tab-btn flex-1 py-2.5 rounded-xl transition-all tab-active flex items-center justify-center gap-2">
        <i data-lucide="calendar" class="w-4 h-4"></i>
        <span>Día de Hoy</span>
      </button>
      <button id="btn-semana" class="tab-btn flex-1 py-2.5 rounded-xl transition-all text-slate-400 hover:text-slate-200 flex items-center justify-center gap-2">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
        <span>Semana Completa</span>
      </button>
    </div>

    <!-- Vista: Día de Hoy -->
    <div id="vista-hoy" class="space-y-3.5">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
          <h2 id="nombre-dia-hoy" class="text-sm font-bold text-white tracking-wide">Cargando día...</h2>
        </div>
        <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full bg-slate-800/60 border border-white/5 text-slate-400">
          08:00 - 13:35
        </span>
      </div>
      <div id="contenedor-periodos-hoy" class="space-y-2.5">
        <!-- JS generará las tarjetas aquí -->
      </div>
    </div>

    <!-- Vista: Semana Completa -->
    <div id="vista-semana" class="hidden space-y-3">
      <div class="w-full glass-card rounded-3xl p-2.5 overflow-hidden border border-white/5">
        <table class="w-full text-center table-fixed border-separate border-spacing-1">
          <thead>
            <tr class="text-slate-400 text-[11px] font-bold">
              <th class="py-2 w-[20%] text-slate-500 font-mono">HORA</th>
              <th class="py-2 text-indigo-400">LU</th>
              <th class="py-2 text-indigo-400">MA</th>
              <th class="py-2 text-indigo-400">MI</th>
              <th class="py-2 text-indigo-400">JU</th>
              <th class="py-2 text-indigo-400">VI</th>
            </tr>
          </thead>
          <tbody id="tabla-semana-body" class="text-[10px]">
            <!-- JS generará la matriz aquí -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="horario.js"></script>
</body>
</html>
