<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedir Tarea - Agenda 6to A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="solicitud.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

  <!-- Encabezado Principal -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-3 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between gap-2">
      
      <div class="flex items-center gap-2 min-w-0">
        <a href="index.html" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition-all flex items-center justify-center shrink-0">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div class="min-w-0 flex-1">
          <h1 class="font-bold text-sm sm:text-base text-white tracking-tight whitespace-nowrap truncate">Solicitudes de Tarea</h1>
          <p class="text-[10px] sm:text-xs text-slate-400 font-medium whitespace-nowrap truncate">¿Había tarea de algo?</p>
        </div>
        <img src="./Pato.gif" alt="Pato" class="w-8 h-8 object-contain rounded-lg shrink-0 ml-1">
      </div>

    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Formulario para realizar consulta -->
    <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-xl">
      <h2 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
        <i data-lucide="help-circle" class="w-4 h-4"></i> Publicar una duda
      </h2>

      <form id="request-form" class="space-y-3">
        <div>
          <label class="block text-[11px] text-slate-400 font-medium mb-1">Materia</label>
          <select id="request-materia" class="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-400" required>
            <option value="" disabled selected>Selecciona la materia...</option>
            <option value="Matemáticas">Matemáticas</option>
            <option value="Física">Física</option>
            <option value="Química">Química</option>
            <option value="Biología">Biología</option>
            <option value="Lenguaje">Lenguaje</option>
            <option value="Inglés">Inglés</option>
            <option value="Filosofía">Filosofía</option>
            <option value="Artes Plásticas">Artes Plásticas</option>
            <option value="Música">Música</option>
            <option value="Educación Física">Educación Física</option>
            <option value="Computación">Computación</option>
            <option value="Religion">Religion</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 font-medium mb-1">Pregunta o Consulta</label>
          <textarea id="request-text" rows="2" placeholder="Ej: ¿El profesor dejó algún práctico para mañana?" class="w-full bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2 focus:outline-none focus:border-amber-400" required></textarea>
        </div>

        <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition-all shadow-lg shadow-amber-500/20 active:scale-[0.98]">
          Enviar consulta al curso
        </button>
      </form>
    </div>

    <!-- Muro de Preguntas Publicadas -->
    <div class="space-y-2">
      <h3 class="text-xs font-semibold text-slate-400 px-1">Consultas recientes</h3>
      <div id="requests-container" class="space-y-3">
        <!-- Se cargan dinámicamente -->
      </div>
    </div>

  </main>

  <script type="module" src="solicitud.js"></script>
</body>
</html>
